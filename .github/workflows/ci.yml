name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: tradeai, POSTGRES_PASSWORD: tradeai, POSTGRES_DB: tradeai }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradeai" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest
      - name: Migrations against Postgres
        env: { TRADEAI_DATABASE_URL: "postgresql+psycopg://tradeai:tradeai@localhost:5432/tradeai" }
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Health check against Postgres
        env: { TRADEAI_DATABASE_URL: "postgresql+psycopg://tradeai:tradeai@localhost:5432/tradeai" }
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 4
          curl -fsS http://127.0.0.1:8000/health
      - name: Live smoke test (real public market data; informational)
        continue-on-error: true   # depends on third-party availability and the runner's region
        env: { TRADEAI_CORS_ORIGINS: "http://localhost:8080" }
        run: |
          uvicorn app.main:app --port 8000 &
          sleep 4
          python scripts/smoke_live.py
          echo "--- backtest on real data: BTCUSDT spot 1H, 90 days ---"
          TRADEAI_DATABASE_URL=sqlite:///./bt.db alembic upgrade head
          TRADEAI_DATABASE_URL=sqlite:///./bt.db python -m app.backtest --symbol BTCUSDT --market spot --days 90
          echo "--- scanner on real data (SQLite) ---"
          export TRADEAI_DATABASE_URL=sqlite:///./scan.db
          alembic upgrade head
          python -m app.scan
          curl -fsS "http://127.0.0.1:8000/api/signals/history?limit=5" > /dev/null || true
          python - <<'PY'
          import sqlite3, json
          con = sqlite3.connect("scan.db")
          for side, payload in con.execute("select side, payload from signals"):
              p = json.loads(payload)
              print(side, p["symbol"], p["market"], "|", p["explanation"][:220])
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: JS syntax check
        run: for f in $(find assets/js -name '*.js'); do node --check "$f"; done
