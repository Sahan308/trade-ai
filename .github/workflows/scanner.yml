name: Scanner
# Hourly scan + lifecycle tracking against the hosted database. Needs repo secret TRADEAI_DATABASE_URL.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
concurrency: { group: scanner, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TRADEAI_DATABASE_URL: ${{ secrets.TRADEAI_DATABASE_URL }}
      TRADEAI_ENV: production
    steps:
      - name: Skip when no database is configured
        id: check
        run: if [ -z "$TRADEAI_DATABASE_URL" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "TRADEAI_DATABASE_URL secret not set — skipping"; fi
        working-directory: .
      - uses: actions/checkout@v5
        if: steps.check.outputs.skip != '1'
      - uses: actions/setup-python@v6
        if: steps.check.outputs.skip != '1'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - if: steps.check.outputs.skip != '1'
        run: pip install -r requirements.txt && alembic upgrade head && python -m app.scan
